<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>المدرب الصوتي</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c28143">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #fefaf7;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      color: #c28143;
      direction: rtl;
    }
    .splash h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .splash p { color: #7f6b58; font-size: 0.9rem; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e2d9d1;
      border-top-color: #c28143;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 1.5rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="splash">
    <h1>🎤 المدرب الصوتي</h1>
    <p>جاري التحميل...</p>
    <div class="spinner"></div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
    setTimeout(() => {
      window.location.replace('https://voicemaster.is-best.net/index.php');
    }, 2000);
  </script>
</body>
</html>
